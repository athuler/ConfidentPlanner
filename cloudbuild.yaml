# Cloud Build: build the image with the data baked in, push it, deploy to Cloud Run.
# Runs from the GitHub trigger (push to main) or manually: gcloud builds submit --config cloudbuild.yaml
substitutions:
  _SERVICE: confident-planner
  _REGION: europe-west1   # domain mappings (custom domain) are not available in europe-west2
  _DATA_BUCKET: ${PROJECT_ID}-data   # holds the git-ignored data assets (upload with `gsutil rsync`, see README)
  _MEMORY: 4Gi   # steady ~1.2 GB + ~0.4 GB per request working set; 2Gi runs at 85% (measured)

steps:
  # 1. bring the git-ignored data assets into the workspace (the trigger checks out git only)
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    id: fetch-data
    entrypoint: bash
    args:
      - -c
      - |
        set -e
        mkdir -p Data/processed Data/reference
        gsutil -m rsync -r gs://${_DATA_BUCKET}/Data/ Data/
        ls -la Data Data/processed Data/reference

  # 2. build the image
  - name: gcr.io/cloud-builders/docker
    id: build
    args:
      - build
      - -t
      - gcr.io/$PROJECT_ID/${_SERVICE}:$SHORT_SHA
      - -t
      - gcr.io/$PROJECT_ID/${_SERVICE}:latest
      - .

  # 3. push both tags
  - name: gcr.io/cloud-builders/docker
    id: push
    args: [push, --all-tags, gcr.io/$PROJECT_ID/${_SERVICE}]

  # 4. deploy: scale to zero when idle, one small instance when busy
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    id: deploy
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image=gcr.io/$PROJECT_ID/${_SERVICE}:$SHORT_SHA
      - --region=${_REGION}
      - --platform=managed
      - --allow-unauthenticated
      - --memory=${_MEMORY}
      - --cpu=1
      - --min-instances=0
      - --max-instances=2
      - --concurrency=80
      - --timeout=300
      - --cpu-boost
      - --quiet

images:
  - gcr.io/$PROJECT_ID/${_SERVICE}:$SHORT_SHA
  - gcr.io/$PROJECT_ID/${_SERVICE}:latest

timeout: 1800s
options:
  logging: CLOUD_LOGGING_ONLY
